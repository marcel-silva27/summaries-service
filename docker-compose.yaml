services:
  gateway:
    build: .
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    environment:
      USERS_URL: ${USERS_URL:-http://users:8000}
      CHANNELS_URL: ${CHANNELS_URL:-http://channels:8000}
      MESSAGES_URL: ${MESSAGES_URL:-http://messages:8000}
      SUMMARIES_URL: ${SUMMARIES_URL:-http://summaries:8000}
      MEDIA_URL: ${MEDIA_URL:-http://media:8000}
      SEARCH_URL: ${SEARCH_URL:-http://search:8000}
      POLLS_URL: ${POLLS_URL:-http://polls-api:8004}
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-10}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      microsvcs:
        aliases: [summaries-gateway]

  summaries:
    build: .
    stop_grace_period: 20s
    ports:
      - "${SUMMARIES_PORT:-8004}:8000"
    # .env.example son los valores por defecto (versionados, sin secretos);
    # .env (ignorado por git) los sobrescribe, p. ej. con LLM_API_KEY.
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      MONGODB_URL: mongodb://summaries-mongodb:27017
      BROKER_URL: ${BROKER_URL:-amqp://summaries-rabbitmq:5672}
    depends_on:
      summaries-mongodb:
        condition: service_healthy
      summaries-rabbitmq:
        condition: service_healthy
    networks: [microsvcs]

  summaries-mongodb:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes: [summaries-data:/data/db]
    networks: [microsvcs]

  # Los puertos no se publican al host para no chocar con otros brokers locales.
  summaries-rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: summaries-rabbitmq
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes: [summaries-rabbitmq-data:/var/lib/rabbitmq]
    networks: [microsvcs]

volumes:
  summaries-data:
  summaries-rabbitmq-data:

networks:
  microsvcs:
    name: ${CHAT_NETWORK:-microsvcs}
    external: true
