# Sin PVC (la cuota permite uno solo): si el pod se reinicia las colas se pierden, pero los eventos
# siguen en la outbox de Mongo y se vuelven a publicar (entrega al menos una vez).
apiVersion: v1
kind: Service
metadata:
  name: summaries-rabbitmq
spec:
  selector:
    app: summaries-rabbitmq
  ports:
    - name: amqp
      port: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summaries-rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: summaries-rabbitmq
  template:
    metadata:
      labels:
        app: summaries-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-alpine
          ports:
            - containerPort: 5672
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 300m, memory: 384Mi}
          # Probes TCP: `rabbitmq-diagnostics` corre como root y, si se adelanta al servidor, crea
          # .erlang.cookie con ese dueño y el servidor ya no puede leerla (eacces).
          readinessProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 5672}
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
