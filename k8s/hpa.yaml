# Máximo 4: la cuota (1 CPU / 1Gi de requests, 10 pods) debe alcanzar también para Mongo y RabbitMQ.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: summaries
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: summaries
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
