# La cuota del namespace permite un solo PVC de 1Gi: se usa para esta base.
apiVersion: v1
kind: Service
metadata:
  name: summaries-mongodb
spec:
  clusterIP: None
  selector:
    app: summaries-mongodb
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: summaries-mongodb
spec:
  serviceName: summaries-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: summaries-mongodb
  template:
    metadata:
      labels:
        app: summaries-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0.43
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - containerPort: 27017
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
