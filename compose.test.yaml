# Stack de pruebas independiente: sin red microsvcs, puertos ni volúmenes del chat.
services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_MONGODB_URL: mongodb://mongodb:27017
      TEST_BROKER_URL: amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:4-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  mongodb:
    image: mongo:7
    # Cada prueba crea una base con varios índices; con el límite de 1024 descriptores
    # (default en algunos hosts Linux) WiredTiger aborta con EMFILE.
    ulimits:
      nofile: {soft: 64000, hard: 64000}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
